<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nana and Opa Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      background: #f3f9fd;
      color: #17324d;
      font-family: "Avenir Next", Avenir, Inter, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 10px 18px;
    }

    #identity {
      min-width: 0;
    }

    #title {
      font-size: clamp(25px, 3.5vw, 34px);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    #subtitle {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #58738d;
      margin-top: 2px;
    }

    #timeRow {
      margin-top: 3px;
      color: #365a77;
      font-size: 13px;
      font-weight: 500;
    }

    #timeDivider {
      margin: 0 7px;
      color: #9ab0c1;
    }

    #controls {
      flex: 0 0 auto;
      text-align: center;
    }

    #findButton {
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 18px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      color: #ffffff;
      background: #1479b8;
      box-shadow: 0 4px 14px rgba(20, 121, 184, 0.22);
    }

    #status {
      min-height: 18px;
      margin-top: 3px;
      font-size: 13px;
      color: #58738d;
    }

    #map {
      width: 100%;
      height: 70vh;
      min-height: 450px;
    }

    .ship-icon {
      font-size: 38px;
      line-height: 38px;
    }

    @media (max-width: 600px) {
      #header {
        flex-direction: column;
        gap: 8px;
        padding: 9px 12px 8px;
        text-align: center;
      }

      #title {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header id="header">
    <div id="identity">
      <div id="title">🚢 Nana and Opa Tracker 🌊</div>
      <div id="subtitle">Holland America Rotterdam</div>
      <div id="timeRow">
        Our time: <span id="ourTime">--</span>
        <span id="timeDivider">•</span>
        Nana &amp; Opa: <span id="shipTime">--</span>
      </div>
    </div>

    <div id="controls">
      <button id="findButton">Find Nana and Opa</button>
      <div id="status">Looking for Nana and Opa...</div>
    </div>
  </header>

  <div id="map"></div>

  <script>
    const map = L.map("map").setView([30, -30], 3);

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      }
    ).addTo(map);

    const shipIcon = L.divIcon({
      html: "🚢",
      className: "ship-icon",
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });

    let shipMarker = null;
    let latestPosition = null;

    const route = L.polyline([], {
      color: "#087fca",
      weight: 4,
      opacity: 0.9
    }).addTo(map);

    const status = document.getElementById("status");
    const findButton = document.getElementById("findButton");
    const ourTime = document.getElementById("ourTime");
    const shipTime = document.getElementById("shipTime");
    let shipTimezone = null;
    const positionsUrl =
      "https://ship-tracker-production-1ccf.up.railway.app/positions";

    function formatTime(timestamp) {
      if (!timestamp) return "Unknown";

      const date = new Date(timestamp);

      return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function formatClock(timeZone) {
      return new Intl.DateTimeFormat([], {
        hour: "numeric",
        minute: "2-digit",
        timeZone,
        timeZoneName: "short"
      }).format(new Date());
    }

    function updateClocks() {
      ourTime.textContent = formatClock();
      shipTime.textContent = shipTimezone
        ? formatClock(shipTimezone)
        : "Locating...";
    }

    async function loadPositions() {
      try {
        const response = await fetch(positionsUrl);

        if (!response.ok) {
          throw new Error("Could not load position history.");
        }

        const positions = await response.json();

        if (!positions.length) {
          status.textContent =
            "No sightings yet — Nana and Opa haven't checked in!";
          return;
        }

        const points = positions.map(p => [
          Number(p.latitude),
          Number(p.longitude)
        ]);

        route.setLatLngs(points);

        latestPosition = positions[positions.length - 1];
        shipTimezone = latestPosition.timezone || "UTC";
        updateClocks();

        const lat = Number(latestPosition.latitude);
        const lon = Number(latestPosition.longitude);

        if (shipMarker) {
          shipMarker.setLatLng([lat, lon]);
        } else {
          shipMarker = L.marker(
            [lat, lon],
            { icon: shipIcon }
          ).addTo(map);
        }

        shipMarker.bindPopup(
          "<b>🚢 Nana and Opa</b><br>" +
          "Last spotted: " +
          formatTime(latestPosition.timestamp)
        );

        status.textContent =
          "Last spotted: " +
          formatTime(latestPosition.timestamp);

        if (points.length > 1) {
          map.fitBounds(route.getBounds(), {
            padding: [40, 40]
          });
        } else {
          map.setView([lat, lon], 7);
        }

      } catch (error) {
        console.error(error);
        status.textContent =
          "Couldn't load Nana and Opa's location.";
      }
    }

    findButton.addEventListener("click", () => {
      if (!latestPosition) return;

      map.setView(
        [
          Number(latestPosition.latitude),
          Number(latestPosition.longitude)
        ],
        7
      );

      if (shipMarker) {
        shipMarker.openPopup();
      }
    });

    loadPositions();
    updateClocks();
    setInterval(updateClocks, 30 * 1000);
    setInterval(loadPositions, 5 * 60 * 1000);
  </script>

</body>
</html>
